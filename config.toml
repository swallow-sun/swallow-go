# Swallow 配置文件
# 复制此文件为 config.local.toml，填入真实 key，config.local.toml 不会被 git 提交
# 所有运行配置只从本文件、本地覆盖文件或数据库读取，不读取环境变量。

[app]
# environment 控制生产安全行为，例如 production 永不输出 SQL；具体最低日志等级由 [log].level 控制。
environment = "development"

[log]
# 可选 debug、info、warn、error。控制台和本地文件使用相同等级。
level = "debug"
# 本地日志目录；当前日志文件名为 swallow.log。
directory = "logs"
# 单个日志文件达到 100MB 后轮转。
max_size_mb = 100
# 最多保留 30 个轮转后的旧日志文件。
max_backups = 30
# 旧日志最多保留 30 天。
max_age_days = 30
# 使用 gzip 压缩轮转后的旧日志。
compress = true

[server]
port = 8888

[llm]
provider = "deepseek"
base_url = "https://api.deepseek.com/v1"
api_key  = ""
model    = "deepseek-chat"

[database]
path = "data/swallow.db"
migrations_dir = "script/migrations"

[auth]
# 可在不提交 Git 的 config.local.toml 中填写，首次启动后会加密写入数据库。
owner_token = ""

[debug]
# pprof HTTP 端口，0=不启动。开发时设 6060，用 go tool pprof 排查内存/goroutine 泄漏。
# 抓堆快照：go tool pprof http://localhost:6060/debug/pprof/heap
# 抓 goroutine：go tool pprof http://localhost:6060/debug/pprof/goroutine
# 生产环境保持 0。
pprof_port = 0

[metrics]
# Prometheus metrics HTTP 端口，0=不启动。开发时设 9100。
# curl http://localhost:9100/metrics 能看到所有指标。
# 生产环境需要 Prometheus 抓取时才开，否则保持 0。
metrics_port = 0
